[project]
name = "book-summarizer-local"
version = "0.1.0"
description = "Chapter-by-chapter book summaries with a local Ollama model or the Claude, OpenAI, and Gemini APIs"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "Alibek Galiyev" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "google-genai>=3.2.0",
    "langchain>=1.4.10",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "markdown>=3.11.3",
    "ollama>=0.6.3",
    "openai>=3.49.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "watchdog>=7.1.0",
]

[project.scripts]
book-summarizer-local = "book_summarizer_local:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
